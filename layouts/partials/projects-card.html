{{/* Expects a project Page (generated by content/projects/_content.gotmpl) */}}
<div class="projects-box mb-5">

<div class="projects-box-col1">
  <a href="{{ .RelPermalink }}">
    {{ partial "project-logo.html" .Params }}
  </a>
</div>

<div class="projects-box-col2">
  <h3 class="mt-0"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
  <p>{{ .Params.brief_summary }}</p>
  <div class="Learn-more">
    <a href="{{ .RelPermalink }}">
      Learn more
      <i class="ph-arrow-right"></i>
    </a>
  </div>
</div>
</div>
